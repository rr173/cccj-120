[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "archivestore"
version = "1.0.0"
description = "Local encrypted archive storage: seal / read-range / verify / rotate (AES-256-GCM + SQLite)"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.setuptools]
packages = ["archivestore", "warcdb", "eventledger", "robots_admission"]
